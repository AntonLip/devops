# =============================================================================
# 01-rbac-developer.yaml
# Урок: 15.3.3 Authorization (RBAC)
# Назначение: роль Developer — управление pods/deployments в devops-lab
# Предусловие: 10-auth-developer-sa.yaml (SA developer в sec-lab)
# Проверка:
#   kubectl auth can-i create deployments \
#     --as=system:serviceaccount:sec-lab:developer -n devops-lab
# Откат: kubectl delete -f 01-rbac-developer.yaml
# =============================================================================

# Role — права ВНУТРИ namespace devops-lab (не cluster-wide)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: developer
  namespace: devops-lab   # Role привязан к namespace приложения
rules:
  # Core API: pods, services, configmaps
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Apps API: deployments, replicasets
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # НЕТ доступа к secrets — принцип least privilege

---
# RoleBinding — связывает SA из sec-lab с Role в devops-lab
# Cross-namespace binding: subject в sec-lab, role в devops-lab — это нормально
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: developer
  namespace: devops-lab
subjects:
  - kind: ServiceAccount
    name: developer
    namespace: sec-lab   # откуда identity (Authentication)
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: developer        # какие права (Authorization)
