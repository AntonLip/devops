# Требует StorageClass local-path (dynamic) ИЛИ замените на manual + pre-created PVs
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: storage-demo
  namespace: storage-lab
spec:
  serviceName: storage-demo
  replicas: 1
  selector:
    matchLabels:
      app: storage-demo
  template:
    metadata:
      labels:
        app: storage-demo
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sleep", "3600"]
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 1Gi
