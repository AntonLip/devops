apiVersion: v1
kind: Pod
metadata:
  name: pod-with-pvc
  namespace: storage-lab
  labels:
    app: pod-with-pvc
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: pvc-lab-static
