apiVersion: v1
kind: Pod
metadata:
  name: pod-readonly-pvc
  namespace: storage-lab
spec:
  securityContext:
    fsGroup: 2000
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
      securityContext:
        runAsUser: 1000
        runAsGroup: 2000
      volumeMounts:
        - name: data
          mountPath: /data
          readOnly: true
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: pvc-lab-static
        readOnly: true
