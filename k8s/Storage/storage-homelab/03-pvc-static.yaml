apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-lab-static
  namespace: storage-lab
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: manual
  resources:
    requests:
      storage: 2Gi
